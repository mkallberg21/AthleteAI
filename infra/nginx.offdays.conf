# Host nginx vhost for 0FFDAYS on k6-server (co-tenant with UtiliTrust and n8n).
#
#   sudo cp ~/offdays/infra/nginx.offdays.conf /etc/nginx/sites-available/offdays
#   sudo ln -s /etc/nginx/sites-available/offdays /etc/nginx/sites-enabled/offdays
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.0ffdays.com
#
# certbot rewrites this block in place to add the 443 listener. Replace
# app.0ffdays.com with whatever hostname DNS actually points at this box.

server {
    listen 80;
    server_name app.0ffdays.com;

    # Coach video (opt-in, one clip) and roster uploads are the largest bodies.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OVERWRITE, never append. uvicorn trusts X-Forwarded-For and the guess
        # throttle keys on it. The stock proxy_params uses
        # $proxy_add_x_forwarded_for, which appends to whatever the client
        # sent -- a script could then put a fresh fake address on every request
        # and never trip the per-address counter. Do not include proxy_params.
        # If this ever sits behind Cloudflare's proxy, use the real_ip module
        # with Cloudflare's ranges so $remote_addr is the true client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Liveness for UptimeRobot: no auth, no DB, not logged.
    location = /api/live {
        proxy_pass http://127.0.0.1:8810;
        access_log off;
    }
}
